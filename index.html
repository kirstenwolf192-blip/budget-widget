  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f1117;
      --surface:#1a1f2e;
      --surface2:#242938;
      --indigo:#6366f1;
      --indigo-dim:#4f46e5;
      --green:#22c55e;
      --amber:#f59e0b;
      --red:#ef4444;
      --text:#f1f5f9;
      --muted:#64748b;
      --soft:#94a3b8;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body{display:flex;flex-direction:column;max-width:430px;margin:0 auto;min-height:100dvh}

    /* Safe area padding */
    .safe-top{padding-top:env(safe-area-inset-top,16px)}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,16px)}

    header{padding:20px 20px 0;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
    .app-title{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
    .app-sub{font-size:26px;font-weight:700;letter-spacing:-0.02em}

    nav{display:flex;gap:8px;padding:16px 20px 0}
    nav button{padding:7px 18px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:background 0.15s,color 0.15s}
    nav button.active{background:var(--indigo);color:#fff}
    nav button:not(.active){background:var(--surface);color:var(--soft)}

    main{flex:1;padding:16px 20px;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}

    .card{background:var(--surface);border-radius:16px;padding:20px;margin-bottom:14px}

    .row{display:flex;justify-content:space-between;align-items:flex-start}
    .label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .big{font-size:30px;font-weight:700;letter-spacing:-0.02em}
    .green{color:var(--green)} .amber{color:var(--amber)} .red{color:var(--red)}

    .bar-track{background:var(--bg);border-radius:8px;height:8px;overflow:hidden;margin-top:14px}
    .bar-fill{height:100%;border-radius:8px;transition:width 0.4s ease,background 0.4s ease}

    .carryover{margin-top:10px;font-size:12px;color:var(--muted)}
    .carryover span{font-weight:600;color:var(--soft)}
    .carryover .pos{color:var(--green)} .carryover .neg{color:var(--red)}

    .section-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:12px}

    .input-row{display:flex;gap:8px;margin-bottom:8px}
    input{background:var(--bg);border:1px solid #334155;border-radius:10px;padding:11px 13px;color:var(--text);font-size:15px;outline:none;width:100%;-webkit-appearance:none}
    input:focus{border-color:var(--indigo)}
    input[type=number]{-moz-appearance:textfield}
    input[type=number]::-webkit-inner-spin-button{display:none}

    .add-row{display:flex;gap:8px}
    .add-row input{flex:1}
    .btn-add{background:var(--indigo);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
    .btn-add:active{background:var(--indigo-dim)}

    .entry{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--bg);border-radius:10px;margin-bottom:6px}
    .entry-name{font-size:14px;font-weight:500}
    .entry-time{font-size:11px;color:var(--muted);margin-top:2px}
    .entry-right{display:flex;align-items:center;gap:10px}
    .entry-amt{font-size:15px;font-weight:600;color:var(--red)}
    .btn-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:0 2px;-webkit-tap-highlight-color:transparent}

    .hist-card{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:10px}
    .hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    .hist-date{font-size:14px;font-weight:600}
    .hist-carry{font-size:13px;font-weight:600}
    .hist-meta{font-size:12px;color:var(--muted);margin-bottom:6px}
    .hist-entry{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);padding:2px 0}

    .empty{color:var(--muted);text-align:center;padding:48px 0;font-size:14px}
  </style>
</head>
<body>
<header>
  <div class="app-title">Daily Budget</div>
  <div class="app-sub">$36.14 / day</div>
</header>

<nav>
  <button id="tab-today" class="active" onclick="switchTab('today')">Today</button>
  <button id="tab-history" onclick="switchTab('history')">History</button>
</nav>

<main id="main-content"></main>

<script>
const DAILY_BASE = 36.14;
const KEY = 'daybudget-v1';

function todayKey() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtDate(s) {
  const [y,m,d] = s.split('-');
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

function fmtTime() {
  return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}

function save(data) {
  localStorage.setItem(KEY, JSON.stringify(data));
}

function ensureToday(data) {
  const today = todayKey();
  const dates = Object.keys(data).sort();
  
  if (!dates.length) {
    data[today] = {budget: DAILY_BASE, spent: 0, entries: []};
    return;
  }

  // Fill any missed days
  const last = dates[dates.length - 1];
  if (last < today) {
    let prev = last;
    while (prev < today) {
      const d = new Date(prev + 'T12:00:00'); d.setDate(d.getDate()+1);
      const y = d.getFullYear(), mo = String(d.getMonth()+1).padStart(2,'0'), dy = String(d.getDate()).padStart(2,'0');
      const next = `${y}-${mo}-${dy}`;
      const prevDay = data[prev];
      const carryover = prevDay.budget - prevDay.spent;
      data[next] = {budget: Math.round((DAILY_BASE + carryover)*100)/100, spent: 0, entries: []};
      prev = next;
    }
  }
}

let currentTab = 'today';

function switchTab(t) {
  currentTab = t;
  document.getElementById('tab-today').className = t==='today'?'active':'';
  document.getElementById('tab-history').className = t==='history'?'active':'';
  render();
}

function addExpense() {
  const label = document.getElementById('inp-label').value.trim();
  const amt = parseFloat(document.getElementById('inp-amt').value);
  if (!label || !amt || amt <= 0) return;

  const data = load();
  ensureToday(data);
  const today = todayKey();
  data[today].spent = Math.round((data[today].spent + amt)*100)/100;
  data[today].entries.push({label, amount: amt, time: fmtTime()});
  save(data);
  document.getElementById('inp-label').value = '';
  document.getElementById('inp-amt').value = '';
  render();
}

function deleteEntry(idx) {
  const data = load();
  const today = todayKey();
  const removed = data[today].entries[idx].amount;
  data[today].entries.splice(idx,1);
  data[today].spent = Math.round((data[today].spent - removed)*100)/100;
  save(data);
  render();
}

function render() {
  const data = load();
  ensureToday(data);
  save(data);

  const today = todayKey();
  const todayData = data[today];
  const remaining = Math.round((todayData.budget - todayData.spent)*100)/100;
  const pct = Math.min(100, (todayData.spent / todayData.budget) * 100);
  const isOver = remaining < 0;
  const barColor = pct < 60 ? 'var(--green)' : pct < 85 ? 'var(--amber)' : 'var(--red)';
  const remClass = isOver ? 'red' : pct > 84 ? 'amber' : 'green';

  const main = document.getElementById('main-content');

  if (currentTab === 'today') {
    const carryAmt = todayData.budget - DAILY_BASE;
    const carryHTML = todayData.budget !== DAILY_BASE
      ? `<div class="carryover">Budget today: <span>$${todayData.budget.toFixed(2)}</span>
          <span class="${carryAmt>=0?'pos':'neg'}">${carryAmt>=0?'+':''}$${carryAmt.toFixed(2)} carried over</span></div>`
      : '';

    const entriesHTML = todayData.entries.length
      ? todayData.entries.map((e,i) => `
          <div class="entry">
            <div><div class="entry-name">${e.label}</div><div class="entry-time">${e.time}</div></div>
            <div class="entry-right">
              <div class="entry-amt">-$${e.amount.toFixed(2)}</div>
              <button class="btn-del" onclick="deleteEntry(${i})">×</button>
            </div>
          </div>`).join('')
      : '';

    main.innerHTML = `
      <div class="card">
        <div class="row">
          <div>
            <div class="label">Available</div>
            <div class="big ${remClass}">${isOver?'-':''}$${Math.abs(remaining).toFixed(2)}</div>
          </div>
          <div style="text-align:right">
            <div class="label">Spent</div>
            <div class="big">$${todayData.spent.toFixed(2)}</div>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
        ${carryHTML}
      </div>

      <div class="card">
        <div class="section-label">Add Expense</div>
        <div class="input-row">
          <input id="inp-label" placeholder="What did you buy?" type="text" autocomplete="off" autocorrect="off" spellcheck="false"/>
        </div>
        <div class="add-row">
          <input id="inp-amt" placeholder="$0.00" type="number" inputmode="decimal" min="0" step="0.01"/>
          <button class="btn-add" onclick="addExpense()">Add</button>
        </div>
      </div>

      ${todayData.entries.length ? `<div class="card"><div class="section-label">Today's Expenses</div>${entriesHTML}</div>` : ''}
    `;

    // Enter key support
    ['inp-label','inp-amt'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('keydown', e => { if (e.key==='Enter') addExpense(); });
    });

  } else {
    // History
    const dates = Object.keys(data).sort().reverse().filter(d => d !== today);
    if (!dates.length) {
      main.innerHTML = '<div class="empty">No history yet — check back tomorrow!</div>';
      return;
    }
    main.innerHTML = dates.map(date => {
      const d = data[date];
      const rem = Math.round((d.budget - d.spent)*100)/100;
      const remStr = rem >= 0 ? `+$${rem.toFixed(2)}` : `-$${Math.abs(rem).toFixed(2)}`;
      const remC = rem >= 0 ? 'green' : 'red';
      const entryRows = d.entries.map(e =>
        `<div class="hist-entry"><span>${e.label}</span><span>$${e.amount.toFixed(2)}</span></div>`
      ).join('');
      return `<div class="hist-card">
        <div class="hist-top">
          <div class="hist-date">${fmtDate(date)}</div>
          <div class="hist-carry ${remC}">${remStr} carried</div>
        </div>
        <div class="hist-meta">Budget $${d.budget.toFixed(2)} · Spent $${d.spent.toFixed(2)}</div>
        ${entryRows}
      </div>`;
    }).join('');
  }
}

// Service Worker for offline support
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => clients.claim());
    self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}

render();
</script>
</body>
</html>
